<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Aplica el tema guardado antes de pintar para evitar parpadeo
        if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
        }
    </script>
    <title>FocusFlow - Add habit</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" sizes="48x48" type="image/png" href="img/favicons.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/authentication.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/add-habit.js"></script>
</head>
<body>
    <header class="mainHeader">
        <div class="container">
            <div class="navigation">
                <div class="navLeft">
                    <button type="button" id="navToggle" class="navToggle" aria-label="Open sections" aria-expanded="false">☰</button>
                    <div class="logo">
                        <h1><a href="index.html">FocusFlow</a></h1>
                    </div>
                    <div id="sectionMenu" class="sectionMenu" role="menu" aria-hidden="true">
                        <div class="sectionMenuHeader">
                            <h2 class="sectionMenuTitle">FocusFlow</h2>
                            <button type="button" id="sectionMenuClose" class="sectionMenuClose" aria-label="Close menu">✕</button>
                        </div>
                        <nav class="sectionList" id="sectionList"></nav>
                    </div>
                </div>
                <nav class="menu">
                    <ul id="subsectionNav" class="subsectionNav"></ul>
                    <ul class="menuActions">
                        <li><a id="logoutBtn" class="logoutBtn">Logout</a></li>
                        <li><button type="button" id="themeToggle" class="themeToggle" aria-label="Toggle theme">☀</button></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="requiresAuth" id="addHabitContainer">
                <div class="dashboardHeader">
                    <h2>Add habit</h2>
                </div>
                <form class="habitForm" id="addHabitForm" name="addHabitForm">
                    <div class="textArea">
                        <label for="habitName">Name</label>
                        <input type="text" id="habitName" name="habitName">
                    </div>
                    <div class="textArea">
                        <label for="habitType">Type</label>
                        <select id="habitType" name="habitType">
                            <option value="" disabled selected>-- Select a category --</option>
                            <option value="Health">Health</option>
                            <option value="Fitness">Fitness</option>
                            <option value="Study">Study</option>
                            <option value="Productivity">Productivity</option>
                            <option value="Mindfulness">Mindfulness</option>
                            <option value="Social">Social</option>
                            <option value="Finance">Finance</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <fieldset class="textArea segmentedField">
                        <legend>Importance</legend>
                        <div class="segmented">
                            <input type="radio" id="importanceLow" name="habitImportance" value="1">
                            <label for="importanceLow">Low</label>
                            <input type="radio" id="importanceMedium" name="habitImportance" value="2" checked>
                            <label for="importanceMedium">Medium</label>
                            <input type="radio" id="importanceHigh" name="habitImportance" value="3">
                            <label for="importanceHigh">High</label>
                        </div>
                    </fieldset>
                    <div class="formActions">
                        <button type="submit" class="submitBtn">Confirm</button>
                        <button type="button" class="cancelBtn" id="cancelBtn">Cancel</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="footerInner">
            <p class="footerProject">FocusFlow · Final Degree Project</p>
            <p class="footerMeta">Pedro Bordell Martín — Grado en Ingeniería Informática</p>
            <p class="footerMeta">Universidad Europea Miguel de Cervantes · Academic year 2025/2026</p>
            <p class="footerNote">
                Academic prototype ·
                <a href="https://github.com/pedrobordell/focusflow" target="_blank" rel="noopener">Source code on GitHub</a>
            </p>
        </div>
    </footer>
</body>
</html>
