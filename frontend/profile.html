<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // Aplica el tema guardado antes de pintar para evitar parpadeo
        if (localStorage.getItem("theme") === "light") {
            document.documentElement.classList.add("light");
        }
    </script>
    <title>FocusFlow - My Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" sizes="48x48" type="image/png" href="img/favicons.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/authentication.js"></script>
    <script src="js/api.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/profile.js"></script>
</head>
<body>
    <header class="mainHeader">
        <div class="container">
            <div class="navigation">
                <div class="navLeft">
                    <button type="button" id="navToggle" class="navToggle" aria-label="Open sections" aria-expanded="false">☰</button>
                    <div class="logo">
                        <h1><a href="index.html">FocusFlow</a></h1>
                    </div>
                    <div id="sectionMenu" class="sectionMenu" role="menu" aria-hidden="true">
                        <div class="sectionMenuHeader">
                            <h2 class="sectionMenuTitle">FocusFlow</h2>
                            <button type="button" id="sectionMenuClose" class="sectionMenuClose" aria-label="Close menu">✕</button>
                        </div>
                        <nav class="sectionList" id="sectionList"></nav>
                    </div>
                </div>
                <nav class="menu">
                    <ul id="subsectionNav" class="subsectionNav"></ul>
                    <ul class="menuActions">
                        <li><a id="logoutBtn" class="logoutBtn">Logout</a></li>
                        <li><button type="button" id="themeToggle" class="themeToggle" aria-label="Toggle theme">☀</button></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section>
        <div class="container">
            <div class="profileContainer" id="profileContainer" name="profileContainer">
                <div class="dashboardHeader">
                    <h2>My Profile</h2>
                </div>
                <div class="profileGrid">
                    <div class="profileCard">
                        <h3>Account</h3>
                        <div class="profileField">
                            <label>Username</label>
                            <p id="profileUsername">—</p>
                        </div>
                        <div class="profileField">
                            <label>Email</label>
                            <p id="profileEmail">—</p>
                        </div>
                        <div class="profileField">
                            <label for="themeSelect">Theme</label>
                            <select id="themeSelect">
                                <option value="dark">Dark</option>
                                <option value="light">Light</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footerInner">
            <p class="footerProject">FocusFlow · Final Degree Project</p>
            <p class="footerMeta">Pedro Bordell Martín — Grado en Ingeniería Informática</p>
            <p class="footerMeta">Universidad Europea Miguel de Cervantes · Academic year 2025/2026</p>
            <p class="footerNote">
                Academic prototype ·
                <a href="https://github.com/pedrobordell/focusflow" target="_blank" rel="noopener">Source code on GitHub</a>
            </p>
        </div>
    </footer>
</body>
</html>
